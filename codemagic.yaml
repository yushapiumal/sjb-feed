# Codemagic CI/CD configuration for Statelink Flutter iOS Application
# Documentation: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/

workflows:
  ios-release:
    name: Flutter iOS Release (Signed IPA)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "org.sjbdigital.app"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Initialize Keychain and Fetch/Create Signing Files
        script: |
          keychain initialize
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "========================================== ERROR =========================================="
            echo "Environment variable CERTIFICATE_PRIVATE_KEY is not defined."
            echo "To use automatic signing, please add CERTIFICATE_PRIVATE_KEY (the RSA 2048-bit private key"
            echo "of your iOS Distribution Certificate) to the 'app_store_credentials' variable group"
            echo "in your Codemagic environment settings."
            echo "==========================================================================================="
            exit 1
          else
            # Reconstruct PEM file if headers/footers are missing from copy-pasting
            if [[ ! "$CERTIFICATE_PRIVATE_KEY" =~ "-----BEGIN" ]]; then
              echo "Formatting CERTIFICATE_PRIVATE_KEY (adding missing PEM headers)..."
              # Auto-detect PKCS#1 vs PKCS#8 based on key prefix
              CLEAN_KEY=$(echo "$CERTIFICATE_PRIVATE_KEY" | tr -d '\n\r ')
              if [[ "$CLEAN_KEY" =~ ^MIIEv ]]; then
                echo "Detected PKCS#8 format key."
                echo "-----BEGIN PRIVATE KEY-----" > /tmp/cert_private_key.pem
                echo "$CERTIFICATE_PRIVATE_KEY" >> /tmp/cert_private_key.pem
                echo "-----END PRIVATE KEY-----" >> /tmp/cert_private_key.pem
              else
                echo "Detected PKCS#1 RSA format key."
                echo "-----BEGIN RSA PRIVATE KEY-----" > /tmp/cert_private_key.pem
                echo "$CERTIFICATE_PRIVATE_KEY" >> /tmp/cert_private_key.pem
                echo "-----END RSA PRIVATE KEY-----" >> /tmp/cert_private_key.pem
              fi
            else
              echo "CERTIFICATE_PRIVATE_KEY already contains PEM headers."
              echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_private_key.pem
            fi
            
            # Run fetch-signing-files using the temp key file
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key=@file:/tmp/cert_private_key.pem
            rm -f /tmp/cert_private_key.pem
          fi
          keychain add-certificates
      - name: Disable Swift Package Manager & Get Flutter Dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build Flutter Release
        script: |
          flutter build ios --release --no-codesign
      - name: Package & Sign IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
      - build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - developer@statelink.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  ios-unsigned:
    name: Flutter iOS Unsigned Build (Testing & Verification)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Disable Swift Package Manager & Get Flutter Dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS App (Unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Package Unsigned Payload as IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Statelink_Unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/Statelink_Unsigned.ipa
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild.log
      - build/ios/archive/*.xcarchive

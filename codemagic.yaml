# Codemagic CI/CD configuration for Statelink Flutter iOS Application
# Documentation: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/

workflows:
  ios-release:
    name: Flutter iOS Release (Signed IPA)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_credentials
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "org.sjbdigital.app"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Initialize Keychain and Fetch/Create Signing Files
        script: |
          keychain initialize
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "========================================== ERROR =========================================="
            echo "Environment variable CERTIFICATE_PRIVATE_KEY is not defined."
            echo "To use automatic signing, please add CERTIFICATE_PRIVATE_KEY (the RSA 2048-bit private key"
            echo "of your iOS Distribution Certificate) to the 'app_store_credentials' variable group"
            echo "in your Codemagic environment settings."
            echo "==========================================================================================="
            exit 1
          else
            echo "--- DEBUG INFO (Non-sensitive) ---"
            echo "Line count: $(echo "$CERTIFICATE_PRIVATE_KEY" | wc -l)"
            echo "Byte count: $(echo "$CERTIFICATE_PRIVATE_KEY" | wc -c)"
            echo "First 15 characters: $(echo "$CERTIFICATE_PRIVATE_KEY" | cut -c 1-15)"
            echo "----------------------------------"
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          fi
          keychain add-certificates
      - name: Disable Swift Package Manager & Get Flutter Dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build Flutter Release
        script: |
          flutter build ios --release --no-codesign
      - name: Package & Sign IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
      - build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - developer@statelink.com
        notify:
          success: true
          failure: true

  ios-unsigned:
    name: Flutter iOS Unsigned Build (Testing & Verification)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Disable Swift Package Manager & Get Flutter Dependencies
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS App (Unsigned)
        script: |
          flutter build ios --release --no-codesign
      - name: Package Unsigned Payload as IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Statelink_Unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/Statelink_Unsigned.ipa
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild.log
      - build/ios/archive/*.xcarchive
